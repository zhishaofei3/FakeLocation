plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fakelocation.app'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'fakelocation123'
            keyAlias 'fakelocation'
            keyPassword 'fakelocation123'
        }
    }

    defaultConfig {
        applicationId "com.fakelocation.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // 高德 3D 地图 10.x+ 仅支持以下 ABI
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 高德地图 SDK 包含 so 库，避免 lint 因缺失平台报错
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // 高德地图：3D 地图合包（已包含 3D 地图 + 定位 + 搜索，无需单独引用）
    implementation 'com.amap.api:3dmap-location-search:latest.integration'
}
